[project]
name = "gemini-live-agent"
version = "0.2.0"
description = "An agentic harness for Gemini Live with local computer access"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.16.0",
    "sounddevice>=0.5.0",
    "mss>=9.0.0",
    "Pillow>=10.0.0",
    "pydantic-settings>=2.14.2",
    "keyring>=25.7.0",
    "platformdirs>=4.10.0",
    "orjson>=3.11.9",
    "PySide6>=6.6.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
gemini-live-agent = "gemini_live_agent._entry:run_with_error_handling"

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-qt>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat-layout project: ship every runtime package plus the two top-level
# entry modules that `gemini_live_agent._entry` imports lazily.
include = [
    "app",
    "audit",
    "core",
    "gemini_live_agent",
    "media",
    "obs",
    "persist",
    "policy",
    "settings",
    "tools",
    "headless.py",
    "main.py",
]
